# PC에서 돌아가는 고정 주소와 회사 서버 인증서를 PC 밖에서 1시간마다 확인한다(2026-10-19 사용자 결정).
# 같은 장애는 GitHub 이슈 하나로 알리고, 복구 시 닫는다.
name: 접속 감시

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "기존 Actions 실패 메일을 시험한다 (검수 사이트 장애를 만들지 않음)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: fixed-preview-uptime
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: 검수 사이트 준비 상태와 장애 알림
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/fixed-preview-uptime.mjs

      - name: 회사 서버 인증서 만료
        continue-on-error: true
        if: ${{ always() }}
        env:
          HOST: uribanhub.com
          WARN_DAYS: "14"
        run: |
          end="$(echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)"
          if [ -z "$end" ]; then
            echo "::error::$HOST 인증서를 읽지 못했습니다. 서버가 꺼졌거나 HTTPS 설정이 바뀌었는지 확인하세요."
            exit 1
          fi
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "만료: $end (남은 날 $days)"
          # 2026-10-20 사용자 결정: 회사 서버 갱신을 미루는 동안 매시간 실패 메일에 진짜 장애 메일이 묻히지 않게,
          # 만료 임박은 실패가 아닌 경고로만 남긴다. 갱신 기한은 원본 저장소 BACKLOG에 둔다.
          if [ "$days" -lt "$WARN_DAYS" ]; then
            echo "::warning::$HOST 인증서가 ${days}일 뒤 만료됩니다. 서버 담당자에게 갱신을 요청하세요."
          fi

      - name: 알림 시험
        if: ${{ inputs.force_failure }}
        run: |
          echo "::error::알림 메일 시험용으로 일부러 실패시켰습니다."
          exit 1
