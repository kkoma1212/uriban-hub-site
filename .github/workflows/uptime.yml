# PC에서 돌아가는 고정 주소와 회사 서버 인증서를 PC 밖에서 1시간마다 확인한다(2026-10-19 사용자 결정).
# 실패하면 GitHub가 이 예약을 마지막으로 올린 계정에 메일로 알린다. 비밀값은 쓰지 않는다.
name: 접속 감시

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "알림 메일이 오는지 시험하려고 일부러 실패시킨다"
        type: boolean
        default: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 고정 주소 준비 상태
        env:
          ORIGIN: https://uriban-hub.kkoma1212.workers.dev
        # 잠깐 끊긴 것으로 메일이 가지 않게 30초 간격으로 세 번까지 본다.
        run: |
          for attempt in 1 2 3; do
            body="$(curl -sS --max-time 20 "$ORIGIN/readyz" 2>&1 || true)"
            if printf '%s' "$body" | grep -q '"status":"ready"'; then
              echo "준비됨 ($attempt번째 확인)"
              exit 0
            fi
            echo "$attempt번째 확인 실패: ${body:0:160}"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "::error::고정 주소가 준비 상태가 아닙니다. PC·Cloudflare 터널·미리보기 서버를 확인하세요."
          exit 1

      - name: 회사 서버 인증서 만료
        if: ${{ always() }}
        env:
          HOST: uribanhub.com
          WARN_DAYS: "14"
        run: |
          end="$(echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)"
          if [ -z "$end" ]; then
            echo "::error::$HOST 인증서를 읽지 못했습니다. 서버가 꺼졌거나 HTTPS 설정이 바뀌었는지 확인하세요."
            exit 1
          fi
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "만료: $end (남은 날 $days)"
          # 2026-10-20 사용자 결정: 회사 서버 갱신을 미루는 동안 매시간 실패 메일에 진짜 장애 메일이 묻히지 않게,
          # 만료 임박은 실패가 아닌 경고로만 남긴다. 갱신 기한은 원본 저장소 BACKLOG에 둔다.
          if [ "$days" -lt "$WARN_DAYS" ]; then
            echo "::warning::$HOST 인증서가 ${days}일 뒤 만료됩니다. 서버 담당자에게 갱신을 요청하세요."
          fi

      - name: 알림 시험
        if: ${{ inputs.force_failure }}
        run: |
          echo "::error::알림 메일 시험용으로 일부러 실패시켰습니다."
          exit 1
